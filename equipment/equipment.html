<script>
    // 获取选择器
    const classSelect = document.querySelector('.class-select');
    const qualitySelect = document.querySelector('.quality-select');
    const equipmentSelects = document.querySelectorAll('.equipment-select');
    
    // 职业与文件名的映射
    const classFileMap = {
        'guiwang': 'ghost_equipment.json',
        'qingyun': 'qingyun_equipment.json',
        'fenxiang': 'fenxiang_equipment.json',
        'hehuan': 'hehuan_equipment.json',
        'lingxi': 'lingxi_equipment.json'
    };

    // 修改品质等级映射
    const qualityLevelMap = {
        '245': [245, 245],
        '265': [265, 265],
        '285': [285, 285],
        '295': [295, 295]
    };
    
    // 更新装备选项的函数
    async function updateEquipmentOptions() {
        const selectedClass = classSelect.value;
        const selectedQuality = qualitySelect.value;
        
        if (selectedClass && classFileMap[selectedClass]) {
            try {
                // 读取装备数据
                const response = await fetch(`data/${classFileMap[selectedClass]}`);
                const equipmentData = await response.json();
                
                // 更新每个装备选择器的选项
                equipmentSelects.forEach((select, index) => {
                    // 清空现有选项
                    select.innerHTML = '<option value="">请选择</option>';
                    
                    // 获取装备类型
                    const equipTypes = ['帽子', '衣服', '护腕', '武器', '腰带', 
                                     '鞋子', '护符1', '护符2', '法印', '令牌',
                                     '星魄1', '星魄2', '星魄3', '星魄4'];
                    const currentEquipType = equipTypes[index];
                    let equipList = equipmentData[currentEquipType] || [];

                    // 修改品质筛选逻辑
                    if (selectedQuality) {
                        equipList = equipList.filter(equip => 
                            equip.level === parseInt(selectedQuality)
                        );
                    }
                    
                    // 添加筛选后的装备选项
                    equipList.forEach(equip => {
                        const option = document.createElement('option');
                        option.value = equip.id;
                        option.textContent = equip.name;
                        select.appendChild(option);
                    });
                });
            } catch (error) {
                console.error(`加载${selectedClass}装备数据失败:`, error);
            }
        } else {
            // 清空所有装备选项
            equipmentSelects.forEach(select => {
                select.innerHTML = '<option value="">请选择</option>';
            });
        }
    }
    
    // 监听职业和品质选择的变化
    classSelect.addEventListener('change', updateEquipmentOptions);
    qualitySelect.addEventListener('change', updateEquipmentOptions);

    // 初始化精炼选择器的选项
    function initRefineOptions() {
        const refineSelects = document.querySelectorAll('.refine-select');
        refineSelects.forEach(select => {
            select.innerHTML = `
                <option value="">精炼等级</option>
                <option value="0">精炼+0</option>
                <option value="1">精炼+1</option>
                <option value="2">精炼+2</option>
                <option value="3">精炼+3</option>
                <option value="4">炼+4</option>
                <option value="5">精炼+5</option>
                <option value="6">精炼+6</option>
            `;
        });
    }

    // 定义精炼属性计算函数
    function calculateRefineAttributes(equipment, refineLevel) {
        const refineBonus = {
            0: { multiplier: 0 },
            1: { multiplier: 0.1 },  // 基础属性提升10%
            2: { multiplier: 0.2 },  // 基础属性提升20%
            3: { multiplier: 0.3 },  // 基础属性提升30%
            4: { multiplier: 0.4 },  // 基础属性提升40%
            5: { multiplier: 0.5 },  // 基础属性提升50%
            6: { multiplier: 0.6 }   // 基础属性提升60%
        };

        if (!equipment || !refineLevel) return {};

        const bonus = refineBonus[refineLevel] || { multiplier: 0 };
        const attributes = { ...equipment.attributes };

        // 计算精炼后的属性值
        for (let attr in attributes) {
            attributes[attr] = Math.floor(attributes[attr] * (1 + bonus.multiplier));
        }

        return attributes;
    }

    // 监听精炼等级变化
    function initRefineListeners() {
        const refineSelects = document.querySelectorAll('.refine-select');
        refineSelects.forEach((select, index) => {
            select.addEventListener('change', function() {
                updateTotalAttributes(); // 需要创建这个函数来更新总属性显示
            });
        });
    }

    // 修改更新总属性显示的函数
    function updateTotalAttributes() {
        const totalAttributes = {
            '力': 0, '敏': 0, '体': 0, '灵': 0, '精': 0,
            '物理攻击': 0, '法术攻击': 0, '会心': 0, '调息': 0,
            '专精': 0, '破甲': 0, '命中': 0
        };

        // 计算星魄属性（移到前面，确保基础属性先计算）
        const starsoulRows = document.querySelectorAll('.starsoul-section .equipment-row');
        starsoulRows.forEach(row => {
            const attributeSelect = row.querySelector('.attribute-select');
            const valueInput = row.querySelector('.attribute-value-input');
            
            const selectedAttr = attributeSelect.value;
            const attrValue = parseInt(valueInput.value) || 0;
            
            if (selectedAttr && totalAttributes.hasOwnProperty(selectedAttr)) {
                totalAttributes[selectedAttr] += attrValue;
                
                // 立即更新显示
                const element = document.querySelector(`[data-attribute="${selectedAttr}"]`);
                if (element) {
                    element.textContent = totalAttributes[selectedAttr];
                }
            }
        });

        // 计算装备属性
        equipmentSelects.forEach((select, index) => {
            const equipmentId = select.value;
            const refineLevel = document.querySelectorAll('.refine-select')[index].value;
            
            if (equipmentId && refineLevel) {
                const equipment = getCurrentEquipmentData(equipmentId);
                if (equipment) {
                    const refinedAttributes = calculateRefineAttributes(equipment, parseInt(refineLevel));
                    
                    for (let attr in refinedAttributes) {
                        if (totalAttributes.hasOwnProperty(attr)) {
                            totalAttributes[attr] += refinedAttributes[attr];
                        }
                    }
                }
            }
        });

        // 更新显示
        for (let attr in totalAttributes) {
            const element = document.querySelector(`[data-attribute="${attr}"]`);
            if (element) {
                element.textContent = totalAttributes[attr];
            }
        }
    }

    // 获取当前装备数据的辅助函数
    function getCurrentEquipmentData(equipmentId) {

        // 返回当前选中装备的数据
        return null; // 临时返回
    }

    // 初始化属性选器的选项
    function initAttributeOptions() {
        const attributeSelects = document.querySelectorAll('.attribute-select');
        const attributes = [
            '力', '敏', '体', '灵', '精',
            '物理攻击', '法术攻击', '会心', '调息',
            '专精', '破甲', '命中'
        ];
        
        attributeSelects.forEach(select => {
            select.innerHTML = '<option value="">选择属性</option>';
            attributes.forEach(attr => {

                select.appendChild(option);

        });

    // 修改星魄监听器
    function initStarsoulListeners() {
        const starsoulRows = document.querySelectorAll('.starsoul-section .equipment-row');
        
        starsoulRows.forEach(row => {
            const attributeSelect = row.querySelector('.attribute-select');
            const valueInput = row.querySelector('.attribute-value-input');
            
            // 监听属性选择变化
            attributeSelect.addEventListener('change', function() {
                // 当选择新属性时，清空输入框
                valueInput.value = '';
                updateTotalAttributes();
            });
            
            // 监听数值输入变化
            valueInput.addEventListener('input', function() {
                // 确保输入的是非负数
                if (this.value < 0) this.value = 0;
                updateTotalAttributes();
            });
        });
    }

    // 页加载初始化
    document.addEventListener('DOMContentLoaded', function() {
        initRefineOptions();
        initRefineListeners();
        initAttributeOptions();
        initStarsoulListeners(); // 添加星魄监听器初始化
    });
</script>
